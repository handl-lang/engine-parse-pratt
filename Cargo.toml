[package]
name = "hnl-engine-parse-pratt"
version = "0.1.0"
edition = "2024"
description = "The Pratt engine for the parse operation (ADR-0044 §3)."
license = "MIT"
repository = "https://github.com/handl-lang/engine-parse-pratt"
homepage = "https://handl-lang.github.io/docs/engine-parse-pratt/"
documentation = "https://handl-lang.github.io/docs/engine-parse-pratt/reference/"
readme = "README.md"
keywords = ["handl", "engine", "parser", "pratt-parser"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-parse-pratt (no crates.io).
publish = false

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
hnl-engine-parse = { git = "https://github.com/handl-lang/engine-parse", branch = "main" }
serde_json = "1"

[dev-dependencies]
handl-test-utils = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"
